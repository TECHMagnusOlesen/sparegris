*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-width:0;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
button{appearance:none;border:0;border-radius:.68rem;font:inherit;color:inherit;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid #2169a0;outline-offset:3px}
button:disabled{cursor:default}
button,.brand,.phase-title,.step-row{ -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.symbols{position:absolute;width:0;height:0;overflow:hidden}
.icon{width:1.22rem;height:1.22rem;display:block;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:min(100%,92rem);margin-inline:auto;padding-inline:clamp(1rem,3.3vw,3.4rem)}
.top{background:white;border-bottom:1px solid var(--line)}
.top .wrap{min-height:4.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.78rem;min-width:0;font-size:clamp(1.06rem,1.1vw + .39rem,1.52rem);line-height:1.14;font-weight:740;letter-spacing:-.044em}
.logo{flex:none;display:grid;place-items:center;width:2.55rem;height:2.55rem;background:#174f45;border-radius:.72rem}
.logo::before{content:"";display:block;width:72%;height:72%;background:#e7f6df;mask:var(--model) center/contain no-repeat;-webkit-mask:var(--model) center/contain no-repeat}
.outline,.media-button,.close-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-size:.95rem;font-weight:640}
.outline{min-height:2.8rem;padding:.48rem .95rem;border:1px solid #b9c9bc;background:white}
.outline:hover,.secondary:hover:not(:disabled),.close-btn:hover{background:#eef3ed;border-color:#91a79c}
main{min-height:0;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-gutter:stable both-edges}
.workspace{display:grid;grid-template-columns:clamp(12rem,16.5vw,15rem) minmax(0,1fr);gap:clamp(1.3rem,2.6vw,2.85rem);align-items:start;min-height:100%;align-content:center;padding-block:clamp(1.1rem,2.5vh,2.4rem)}
aside{align-self:start;padding-top:.14rem}
.project{margin:0;position:relative;overflow:hidden;isolation:isolate;border-radius:1.03rem;min-height:8rem;aspect-ratio:1.52;background-color:#174e43;background-image:linear-gradient(135deg,#1f60503b,#10392f99),linear-gradient(90deg,#b1d1ae13 1px,transparent 1px),linear-gradient(#b1d1ae13 1px,transparent 1px);background-size:auto,1.45rem 1.45rem,1.45rem 1.45rem;color:#f4f9ee;box-shadow:inset 0 0 0 1px #15382c45}
.project-model{position:absolute;inset:7% 7% 19%;background:var(--model) center center/contain no-repeat;filter:drop-shadow(0 .32rem .26rem #0729206b)}
.project figcaption{position:absolute;bottom:.72rem;left:.9rem;right:.6rem;font-size:.86rem;font-weight:620;letter-spacing:.005em;color:#e3f0e2}
.phases{margin-top:clamp(1.1rem,2.6vh,1.9rem)}
.phases h2{font-size:.94rem;font-weight:700;margin:0 .12rem .64rem;letter-spacing:-.012em}
.phase{width:100%;min-height:3.95rem;display:flex;align-items:center;gap:.68rem;padding:.61rem .68rem;text-align:left;border:1px solid transparent;border-radius:.72rem}
.phase+.phase{margin-top:.23rem}
.phase:hover{background:#e7ede5}
.phase[aria-current="true"]{background:#dfede1;border-color:#bed3c1}
.phase-icon{flex:none;width:2.15rem;height:2.15rem;display:grid;place-items:center;border:1px solid #ced8ce;color:#405c51;background:#fcfdfb;border-radius:.63rem}
.phase-icon .icon{width:1.29rem;height:1.29rem}
.phase[aria-current="true"] .phase-icon{color:#fff;border-color:var(--green);background:var(--green)}
.phase-label{display:block;font-weight:680;font-size:.96rem;line-height:1.15;letter-spacing:-.018em}
.phase-range{display:block;color:#4b6255;font-size:.85rem;line-height:1.2;margin-top:.25rem}
.stage{min-width:0;width:100%}
.stage-head{display:flex;align-items:end;justify-content:space-between;gap:.7rem 1.25rem;margin:0 0 .92rem}
.h-group{min-width:0}
.kicker{display:flex;align-items:center;gap:.52rem;color:var(--green);font-weight:670;font-size:.88rem;margin:0 0 .25rem;letter-spacing:.015em}
.kicker::before{content:"";width:1.25rem;height:.18rem;border-radius:1rem;background:var(--gold)}
h1{font-size:clamp(1.65rem,2.4vw,2.65rem);line-height:1.08;font-weight:735;letter-spacing:-.052em;margin:0;text-wrap:balance}
.media-actions{display:flex;align-items:center;flex:none;gap:.24rem}
.media-button{font-size:.9rem;min-height:2.75rem;padding:.45rem .58rem;color:#31564b;line-height:1.1}
.media-button:hover{background:#e0eadf;color:var(--deep)}
.media-button:disabled{color:#86948b}
.media-button .icon{width:1.07rem;height:1.07rem}
.figure{margin:0}
.screen{position:relative;overflow:hidden;display:grid;place-items:center;isolation:isolate;width:100%;height:clamp(13.8rem,calc(100vh - 16rem),64rem);height:clamp(13.8rem,calc(100dvh - 16rem),64rem);max-height:calc((100vw - clamp(12rem,16.5vw,15rem) - clamp(1.3rem,2.6vw,2.85rem) - 2 * clamp(1rem,3.3vw,3.4rem)) * .5625);border:1px solid #bdcabe;border-radius:1.08rem;background:var(--gif);box-shadow:0 .2rem .8rem #263d3010}
.screen img{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;grid-area:1/1;background:var(--gif)}
.status{grid-area:1/1;text-align:center;max-width:32rem;padding:1.25rem;font-size:1rem;color:var(--quiet)}
.status strong{display:block;color:var(--ink);font-size:1.15rem;margin:0 0 .4rem}
.status p{margin:.3rem 0 .85rem}
.status code{overflow-wrap:anywhere;font-size:.92rem;color:#304c3d}

const rolig = window.matchMedia('(prefers-reduced-motion: reduce)');
let valgt = -1;
let stille = rolig.matches;
let billede = null;
let visning = 0;
let ur;

function visMobilTitel() {
  const bruges = mobilPortraet.matches && figur.dataset.close === 'true' &&
    figur.dataset.multi === 'true' && billede !== null;
  if (!bruges) { mobilTitel.replaceChildren(); return; }
  const adresse = billede.currentSrc || billede.src;
  if (mobilTitel.firstElementChild?.src === adresse) return;
  const kopi = new Image();
  kopi.alt = ''; kopi.src = adresse;
  mobilTitel.replaceChildren(kopi);
}

function mobilUdsnit(i) {
  // Udsnit af de originale GIF-filer på 960 × 540 px. Hele kortet ligger i den anden visning.
  const [x,y,w,h] = i === 30 ? [24,148,576,368] : i === 0 ? [23,146,689,374] : [18,145,687,376];
  figur.style.setProperty('--crop-ratio',w+' / '+h);
  figur.style.setProperty('--crop-left',(-100*x/w)+'%');
  figur.style.setProperty('--crop-top',(-100*y/h)+'%');
  figur.style.setProperty('--crop-width',(96000/w)+'%');
  figur.dataset.multi = String([0,23,24,29,30].includes(i));
}

function vaelgUdsnit(taet) {
  figur.dataset.close = String(taet);
  vedId('close-view').setAttribute('aria-pressed',String(taet));
  vedId('whole-view').setAttribute('aria-pressed',String(!taet));
  visMobilTitel();
}

function fase(i) { return i === 0 ? 0 : i === trin.length - 1 ? 2 : 1; }

function opdaterSkift() {
  vedId('view-label').textContent = stille ? 'Afspil animation' : 'Vis slutbillede';
  vedId('view-icon').setAttribute('href', stille ? '#i-play' : '#i-frame');
}

function visMedie(proevIgen = false) {
  const nummer = ++visning;
  const post = trin[valgt];
  const filer = [post.fil];
  // Før pakningen hed den første bukke-GIF Sparegris_Buk_1.gif.
  if (valgt === 1) filer.push('Sparegris_Buk_1.gif');
  let filNr = 0;
  clearTimeout(ur);
  if (billede) billede.remove();
  billede = null;
  figur.dataset.ready = 'false';
  mobilTitel.replaceChildren();
  vedId('missing').hidden = true;
  vedId('loading').hidden = true;
  vedId('zoom').disabled = true;
  skaerm.setAttribute('aria-busy','true');
  opdaterSkift();
  ur = setTimeout(() => { if (nummer === visning) vedId('loading').hidden = false; }, 300);
  const img = new Image();
  img.alt = (stille ? 'Slutbillede. ' : '') + post.tekst;
  img.width = 960; img.height = 540;
  function sti() {
    // Fragmentet bliver i browseren, så tidligere trin kan bruges fra dens cache.
    return gifMappe + encodeURIComponent(filer[filNr]) + (proevIgen ? '?igen=' + nummer : '') + '#vis-' + nummer;
  }
  img.onload = () => {
    if (nummer !== visning) return;
    clearTimeout(ur);
    vedId('loading').hidden = true;
    skaerm.setAttribute('aria-busy','false');
    billede = img;
    skaerm.prepend(img);
    figur.dataset.ready = 'true';
    visMobilTitel();
    vedId('zoom').disabled = false;
  };
  img.onerror = () => {
    if (nummer !== visning) return;
    if (!stille && filNr + 1 < filer.length) { filNr++; img.src = sti(); return; }
    clearTimeout(ur);
    vedId('loading').hidden = true;
    vedId('missing-path').textContent = gifMappe + post.fil;
    vedId('missing').hidden = false;
    skaerm.setAttribute('aria-busy','false');
  };
  img.src = stille ? slutbilleder[post.fil] : sti();
}

function bygListe() {
  let forrigeFase = -1;
  trin.forEach((post,i) => {
    const f = fase(i);
    if (f !== forrigeFase) {
      const h = document.createElement('h3'); h.textContent = typer[f]; liste.append(h);
      forrigeFase = f;
    }
    const knap = document.createElement('button');
    knap.type = 'button'; knap.className = 'step-row'; knap.dataset.trin = i;
    const nr = document.createElement('span'); nr.className = 'step-n'; nr.textContent = i+1;
    knap.append(nr, document.createTextNode(post.titel)); liste.append(knap);
  });
}

function visTrin(i) {
  if (valgt === i) return;
  valgt = i;
  const post = trin[i], f = fase(i);
  mobilUdsnit(i);
  const pos = i + 1;
  const gammelFokus = document.activeElement;
  vedId('prev').disabled = i === 0;
  vedId('next').disabled = i === trin.length - 1;
  vedId('title').textContent = post.titel;
  vedId('phase-text').textContent = 'Del ' + (f+1) + ' af 3' + (f === 1 ? '  ·  Buk ' + i + ' af 29' : '');
  vedId('instruction').textContent = post.tekst;
  vedId('position').textContent = pos;
  vedId('progress').value = pos;
  vedId('progress').setAttribute('aria-valuetext','Trin ' + pos + ' af ' + trin.length);
  document.title = post.titel + ' – Byg en sparegris';
  faseKnapper.forEach((k,j) => k.setAttribute('aria-current',String(j === f)));
  liste.querySelectorAll('[data-trin]').forEach(k => {
    if (Number(k.dataset.trin) === i) k.setAttribute('aria-current','step');
    else k.removeAttribute('aria-current');
  });
  vedId('main').scrollTop = 0;
  vedId('announcement').textContent = 'Trin ' + pos + ' af ' + trin.length + '. ' + post.titel + '. ' + post.tekst;
  visMedie();
  if (gammelFokus === vedId('next') && vedId('next').disabled) vedId('prev').focus();
  if (gammelFokus === vedId('prev') && vedId('prev').disabled) vedId('next').focus();
}

function fraAdresse() {
  const maerke = /^#trin-([1-9][0-9]*)$/.exec(location.hash);
  const pos = maerke ? Number(maerke[1]) : 1;
  return Number.isSafeInteger(pos) && pos <= trin.length ? pos-1 : 0;
}
function gaaTil(i) {
  if (!Number.isInteger(i) || i < 0 || i >= trin.length || i === valgt) return;
  location.hash = 'trin-' + (i+1);
  visTrin(i);
}
window.addEventListener('hashchange',() => {
  if (zoomDialog.open) zoomDialog.close();
  if (listeDialog.open) listeDialog.close();
  visTrin(fraAdresse());
});
vedId('prev').addEventListener('click',() => gaaTil(valgt-1));
vedId('next').addEventListener('click',() => gaaTil(valgt+1));
faseKnapper.forEach(k => k.addEventListener('click',() => gaaTil(Number(k.dataset.start))));
vedId('switch-view').addEventListener('click',() => { stille = !stille; visMedie(); });
vedId('retry').addEventListener('click',() => visMedie(true));
vedId('close-view').addEventListener('click',() => vaelgUdsnit(true));
vedId('whole-view').addEventListener('click',() => vaelgUdsnit(false));
mobilPortraet.addEventListener('change',visMobilTitel);
vedId('all-steps').addEventListener('click',() => {
  listeDialog.showModal();
  const aktuel = liste.querySelector('[aria-current="step"]');
  aktuel.focus({preventScroll:true}); aktuel.scrollIntoView({block:'nearest'});
});
liste.addEventListener('click',e => {
  const k = e.target.closest('[data-trin]');
  if (!k) return;
  listeDialog.close();
  gaaTil(Number(k.dataset.trin));
});
vedId('zoom').addEventListener('click',() => {
  if (!billede) return;
  const stort = vedId('zoom-img');
  vedId('zoom-title').textContent = trin[valgt].titel;
  stort.src = billede.currentSrc || billede.src; stort.alt = billede.alt;
  zoomDialog.showModal();
  const flade = zoomDialog.querySelector('.zoom-scroll');
  flade.scrollTop = 0; flade.scrollLeft = 0;
});
zoomDialog.addEventListener('close',() => vedId('zoom-img').removeAttribute('src'));
[zoomDialog,listeDialog].forEach(d => {
  d.querySelector('.close-btn').addEventListener('click',() => d.close());
  d.addEventListener('click',e => {
    if (e.target !== d) return;
    const r = d.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close();
  });
});
document.addEventListener('keydown',e => {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || listeDialog.open || zoomDialog.open) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    gaaTil(valgt + (e.key === 'ArrowRight' ? 1 : -1));
  }
});
bygListe();
visTrin(fraAdresse());
</script>
</body>
</html>
